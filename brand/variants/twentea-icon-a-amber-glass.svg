<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Twentea, Amber glass</title>
<defs>
    <linearGradient id="v0bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B55E"/><stop offset="1" stop-color="#C9631A"/>
    </linearGradient>
    <linearGradient id="v0tea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E3510"/><stop offset="1" stop-color="#9A5218"/>
    </linearGradient>
    <filter id="v0shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <!-- Liquid glass: specular sheen from a blurred height map, plus a bright rim at the edges -->
    <filter id="v0glass" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="h"/>
      <feSpecularLighting in="h" surfaceScale="6" specularConstant="0.9" specularExponent="40" lighting-color="#FFFFFF" result="s">
        <feDistantLight azimuth="225" elevation="40"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
      <feMorphology in="SourceAlpha" operator="erode" radius="3" result="er"/>
      <feComposite in="SourceAlpha" in2="er" operator="out" result="rimA"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.7"/>
      <feComposite in2="rimA" operator="in" result="rim"/>
      
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sIn"/><feMergeNode in="rim"/></feMerge>
    </filter>
<linearGradient id="v0jel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB347"/><stop offset="1" stop-color="#D2560B"/>
    </linearGradient><mask id="v0m"><g fill="#FFFFFF" stroke="#FFFFFF">
      <path d="M384 512 C384 482 407 462 436 462 C466 462 488 484 488 512 C488 542 466 560 440 582 L384 630 H490" fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="564" cy="548" rx="52" ry="80" fill="none" stroke-width="40"/></g></mask></defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#v0bg)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.85">
    <path d="M412 362 C384 322 440 292 412 242"/>
    <path d="M480 372 C452 322 508 282 480 222"/>
    <path d="M548 362 C520 322 576 292 548 242"/>
  </g>
  <ellipse cx="480" cy="762" rx="300" ry="42" fill="#FFFFFF" opacity="0.92"/>
  <circle cx="734" cy="548" r="62" fill="none" stroke="#FFFFFF" stroke-width="34"/>
  <path d="M250 430 H710 V560 C710 682 610 742 480 742 C350 742 250 682 250 560 Z" fill="#FFFFFF"/>
  <ellipse cx="480" cy="430" rx="230" ry="32" fill="url(#v0tea)"/>

  <g transform="translate(5 9)" filter="url(#v0shadow)" opacity="0.28">
    <g fill="#6E3510" stroke="#6E3510">
      <path d="M384 512 C384 482 407 462 436 462 C466 462 488 484 488 512 C488 542 466 560 440 582 L384 630 H490" fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="564" cy="548" rx="52" ry="80" fill="none" stroke-width="40"/></g>
  </g>
  <g filter="url(#v0glass)">
      <g fill="#C9631A" stroke="#C9631A" opacity="0.88">
      <path d="M384 512 C384 482 407 462 436 462 C466 462 488 484 488 512 C488 542 466 560 440 582 L384 630 H490" fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="564" cy="548" rx="52" ry="80" fill="none" stroke-width="40"/></g>
  </g>
</svg>
