<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Twentea, Tea-filled glass</title>
<defs>
    <linearGradient id="v1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B55E"/><stop offset="1" stop-color="#C9631A"/>
    </linearGradient>
    <linearGradient id="v1tea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E3510"/><stop offset="1" stop-color="#9A5218"/>
    </linearGradient>
    <filter id="v1shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <!-- Liquid glass: specular sheen from a blurred height map, plus a bright rim at the edges -->
    <filter id="v1glass" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="h"/>
      <feSpecularLighting in="h" surfaceScale="5" specularConstant="0.9" specularExponent="40" lighting-color="#FFFFFF" result="s">
        <feDistantLight azimuth="225" elevation="40"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
      <feMorphology in="SourceAlpha" operator="erode" radius="3" result="er"/>
      <feComposite in="SourceAlpha" in2="er" operator="out" result="rimA"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.7"/>
      <feComposite in2="rimA" operator="in" result="rim"/>
      
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sIn"/><feMergeNode in="rim"/></feMerge>
    </filter>
<linearGradient id="v1jel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB347"/><stop offset="1" stop-color="#D2560B"/>
    </linearGradient><mask id="v1m"><g fill="#FFFFFF" stroke="#FFFFFF">
      <circle cx="394" cy="503" r="25" stroke="none"/>
      <path d="M394 503 C394 476 416 460 442 460 C472 460 492 480 492 508 C492 538 470 556 444 578 L392 624" fill="none" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="378" y="610" width="122" height="32" rx="10" stroke="none"/>
      <path fill-rule="evenodd" stroke="none" d="M502 551 A60 90 0 1 0 622 551 A60 90 0 1 0 502 551 Z M538 551 A24 58 0 1 0 586 551 A24 58 0 1 0 538 551 Z"/></g></mask></defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#v1bg)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.85">
    <path d="M412 362 C384 322 440 292 412 242"/>
    <path d="M480 372 C452 322 508 282 480 222"/>
    <path d="M548 362 C520 322 576 292 548 242"/>
  </g>
  <ellipse cx="480" cy="762" rx="300" ry="42" fill="#FFFFFF" opacity="0.92"/>
  <circle cx="734" cy="548" r="62" fill="none" stroke="#FFFFFF" stroke-width="34"/>
  <path d="M250 430 H710 V560 C710 682 610 742 480 742 C350 742 250 682 250 560 Z" fill="#FFFFFF"/>
  <ellipse cx="480" cy="430" rx="230" ry="32" fill="url(#v1tea)"/>

  <g transform="translate(5 9)" filter="url(#v1shadow)" opacity="0.28">
    <g fill="#6E3510" stroke="#6E3510">
      <circle cx="394" cy="503" r="25" stroke="none"/>
      <path d="M394 503 C394 476 416 460 442 460 C472 460 492 480 492 508 C492 538 470 556 444 578 L392 624" fill="none" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="378" y="610" width="122" height="32" rx="10" stroke="none"/>
      <path fill-rule="evenodd" stroke="none" d="M502 551 A60 90 0 1 0 622 551 A60 90 0 1 0 502 551 Z M538 551 A24 58 0 1 0 586 551 A24 58 0 1 0 538 551 Z"/></g>
  </g>
  <g filter="url(#v1glass)">
      <g fill="#EFA55C" stroke="#EFA55C" opacity="0.6">
      <circle cx="394" cy="503" r="25" stroke="none"/>
      <path d="M394 503 C394 476 416 460 442 460 C472 460 492 480 492 508 C492 538 470 556 444 578 L392 624" fill="none" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="378" y="610" width="122" height="32" rx="10" stroke="none"/>
      <path fill-rule="evenodd" stroke="none" d="M502 551 A60 90 0 1 0 622 551 A60 90 0 1 0 502 551 Z M538 551 A24 58 0 1 0 586 551 A24 58 0 1 0 538 551 Z"/></g>
      <g mask="url(#v1m)"><path d="M360 566 C400 552 430 580 470 566 C510 552 540 580 580 566 C600 559 620 562 640 566 V660 H360 Z" fill="#7A3B0C" opacity="0.95"/></g>
  </g>
</svg>
